name: Release

# Push a tag like v1.0.0 to build a universal AirCursor.app and attach it to a GitHub Release.
#
# Optional — for a signed + notarized build that opens without Gatekeeper warnings,
# add these repository secrets (Settings › Secrets and variables › Actions):
#   MACOS_CERT_P12        base64 of your "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD   password for that .p12
#   NOTARY_APPLE_ID       Apple ID email
#   NOTARY_TEAM_ID        10-character Team ID
#   NOTARY_PASSWORD       app-specific password for notarytool
# Without them the release is ad-hoc signed (users approve it once in System Settings).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal app
        run: |
          SIGN_IDENTITY="${SIGN_IDENTITY:--}" BUILD_NUMBER="${{ github.run_number }}" scripts/build-app.sh
          ditto -c -k --keepParent build/AirCursor.app "build/AirCursor-$VERSION.zip"

      - name: Notarize
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool submit "build/AirCursor-$VERSION.zip" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple build/AirCursor.app
          rm "build/AirCursor-$VERSION.zip"
          ditto -c -k --keepParent build/AirCursor.app "build/AirCursor-$VERSION.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Also attach a stable name so this link always serves the newest build:
          # https://github.com/${{ github.repository }}/releases/latest/download/AirCursor.zip
          cp "build/AirCursor-$VERSION.zip" build/AirCursor.zip
          gh release create "$GITHUB_REF_NAME" build/AirCursor.zip "build/AirCursor-$VERSION.zip" \
            --title "AirCursor $VERSION" --generate-notes
